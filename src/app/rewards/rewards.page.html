<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/dashboard"></ion-back-button></ion-buttons><ion-title>Rewards</ion-title><ion-buttons slot="end"><ion-button routerLink="/wallet">{{ loyalty.member.points | number }} pts</ion-button></ion-buttons></ion-toolbar></ion-header>
<ion-content class="ion-padding"><p class="intro">Turn your points into treats and savings. Your selected reward will be redeemed at the counter.</p><div class="reward-links"><ion-button fill="outline" size="small" routerLink="/my-rewards">My rewards</ion-button><ion-button fill="outline" size="small" routerLink="/vouchers">My vouchers</ion-button></div><ion-segment value="all"><ion-segment-button value="all"><ion-label>All</ion-label></ion-segment-button><ion-segment-button value="rewards"><ion-label>Rewards</ion-label></ion-segment-button><ion-segment-button value="vouchers"><ion-label>Vouchers</ion-label></ion-segment-button></ion-segment><ion-card *ngFor="let reward of loyalty.rewards" [class]="reward.colour"><ion-card-header><ion-card-subtitle>{{ reward.category }}</ion-card-subtitle><ion-card-title>{{ reward.name }}</ion-card-title></ion-card-header><ion-card-content><p>{{ reward.description }}</p><div><strong>{{ reward.points }} points</strong><ion-button size="small" (click)="redeem(reward)" [disabled]="loyalty.member.points < reward.points">Redeem</ion-button></div></ion-card-content></ion-card></ion-content>
