<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/dashboard"></ion-back-button></ion-buttons><ion-title>Profile</ion-title><ion-buttons slot="end"><ion-button routerLink="/edit-profile">Edit</ion-button></ion-buttons></ion-toolbar></ion-header>
<ion-content><section class="profile-summary ion-padding"><ion-avatar><div>{{ loyalty.member.name.charAt(0) }}</div></ion-avatar><h1>{{ loyalty.member.name }}</h1><p>{{ loyalty.member.tier }} member</p></section><ion-list inset="true"><ion-item button routerLink="/edit-profile"><ion-icon slot="start" name="person-outline"></ion-icon><ion-label>Personal details</ion-label></ion-item><ion-item button routerLink="/notifications"><ion-icon slot="start" name="notifications-outline"></ion-icon><ion-label>Notifications</ion-label></ion-item><ion-item button routerLink="/stores"><ion-icon slot="start" name="location-outline"></ion-icon><ion-label>Find a store</ion-label></ion-item></ion-list><ion-card><ion-card-content><p>Your referral code</p><div class="referral"><strong>{{ loyalty.member.referralCode }}</strong><ion-button fill="clear" size="small" (click)="copyReferralCode()">Copy</ion-button></div><small>Invite friends to join the loyalty programme.</small></ion-card-content></ion-card><ion-list inset="true"><ion-item button routerLink="/feedback"><ion-icon slot="start" name="help-circle-outline"></ion-icon><ion-label>Help and feedback</ion-label></ion-item><ion-item button color="danger" (click)="logout()"><ion-icon slot="start" name="log-out-outline"></ion-icon><ion-label>Log out</ion-label></ion-item></ion-list></ion-content>
