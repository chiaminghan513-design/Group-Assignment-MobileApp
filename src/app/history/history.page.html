<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/dashboard"></ion-back-button></ion-buttons><ion-title>Activity history</ion-title></ion-toolbar></ion-header>
<ion-content><ion-segment [(ngModel)]="selectedFilter" class="ion-padding"><ion-segment-button value="all"><ion-label>All</ion-label></ion-segment-button><ion-segment-button value="earn"><ion-label>Earned</ion-label></ion-segment-button><ion-segment-button value="reward"><ion-label>Redeemed</ion-label></ion-segment-button></ion-segment><ion-list lines="full"><ion-item *ngFor="let item of loyalty.activity" [hidden]="selectedFilter !== 'all' && item.type !== selectedFilter"><ion-icon slot="start" [name]="item.icon" color="primary"></ion-icon><ion-label><h2>{{ item.title }}</h2><p>{{ item.subtitle }}</p><p>{{ item.date }}</p></ion-label><ion-note slot="end">{{ item.amount }}</ion-note></ion-item></ion-list></ion-content>
