<ion-content class="ion-padding choice-content">
  <!-- Top Section: Brand & Welcome -->
  <div class="brand-container ion-text-center">
    <h1 class="brand-title">[BRAND]</h1>
    <p class="brand-subtitle">Earn points, stamps, and exclusive rewards with every visit.</p>
  </div>

  <!-- Middle Section: Illustration or Graphic Placeholder -->
  <div class="illustration-container ion-text-center">
    <div class="placeholder-box">
      <ion-icon name="gift-outline" size="large" color="primary"></ion-icon>
      <p>Welcome to our Loyalty Program</p>
    </div>
  </div>

  <!-- Bottom Section: Action Buttons -->
  <div class="button-container">
    <ion-button expand="block" shape="round" color="primary" (click)="goToLogin()">
      Login to Account
    </ion-button>
    
    <ion-button expand="block" shape="round" fill="outline" color="primary" (click)="goToRegister()">
      Create New Account
    </ion-button>
  </div>
</ion-content>
