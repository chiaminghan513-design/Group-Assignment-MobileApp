<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/dashboard"></ion-back-button></ion-buttons><ion-title>Activity history</ion-title></ion-toolbar></ion-header>
<ion-content><ion-segment scrollable="true" [(ngModel)]="selectedFilter" (ionChange)="load($event.detail.value)" class="ion-padding"><ion-segment-button value="all"><ion-label>All</ion-label></ion-segment-button><ion-segment-button value="topups"><ion-label>Top-ups</ion-label></ion-segment-button><ion-segment-button value="payments"><ion-label>Payments</ion-label></ion-segment-button><ion-segment-button value="points"><ion-label>Points</ion-label></ion-segment-button><ion-segment-button value="stamps"><ion-label>Stamps</ion-label></ion-segment-button><ion-segment-button value="rewards"><ion-label>Rewards</ion-label></ion-segment-button><ion-segment-button value="vouchers"><ion-label>Vouchers</ion-label></ion-segment-button></ion-segment><ion-progress-bar type="indeterminate" *ngIf="loading"></ion-progress-bar><ion-list lines="full"><ion-item *ngFor="let item of loyalty.activity"><ion-icon slot="start" [name]="item.icon" color="primary"></ion-icon><ion-label><h2>{{ item.title }}</h2><p>{{ item.subtitle }}</p><p>{{ item.date }}</p></ion-label><ion-note slot="end">{{ item.amount }}</ion-note></ion-item></ion-list><p class="ion-padding" *ngIf="!loading && !loyalty.activity.length">There’s no activity in this category yet.</p></ion-content>
